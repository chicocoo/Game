name: Android

on:
  push:
    branches: ["**"]
    paths-ignore: ["dist/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_builds:
        description: "Déposer l'APK et l'AAB dans dist/ sur la branche"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (si les secrets sont configurés)
        env:
          KEYSTORE_B64: ${{ secrets.ATOLL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ATOLL_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Tests de la logique de jeu
        run: ./gradlew :core:test --no-daemon

      - name: Compiler l'APK de test et le bundle Play Store
        env:
          ATOLL_KEYSTORE_PASSWORD: ${{ secrets.ATOLL_KEYSTORE_PASSWORD }}
          ATOLL_KEY_ALIAS: ${{ secrets.ATOLL_KEY_ALIAS }}
          ATOLL_KEY_PASSWORD: ${{ secrets.ATOLL_KEY_PASSWORD }}
          ATOLL_ADMOB_APP_ID: ${{ secrets.ATOLL_ADMOB_APP_ID }}
          ATOLL_ADMOB_REWARDED: ${{ secrets.ATOLL_ADMOB_REWARDED }}
          ATOLL_ADMOB_INTERSTITIAL: ${{ secrets.ATOLL_ADMOB_INTERSTITIAL }}
          ATOLL_LINK_HOST: ${{ vars.ATOLL_LINK_HOST }}
          ATOLL_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon 2>&1 | tee build.log

      - name: Résumé des erreurs
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not" build.log | head -80 || true

      - uses: actions/upload-artifact@v4
        with:
          name: atoll-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: atoll-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Déposer les fichiers compilés dans dist/
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_builds }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/atoll-debug.apk
          cp app/build/outputs/bundle/release/*.aab dist/atoll-release-unsigned.aab
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Fichiers compilés (APK de test, AAB) [skip ci]"
          git push
